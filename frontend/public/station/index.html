<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitVillage — 우주정거장 LMS 프론트 데모</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
<!-- three.js는 디자인 캔버스와 같은 r150으로 고정 (조명·색 감각이 시안과 똑같이 나오도록) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<!-- 도형 아이콘 스프라이트 (HUD 전용 2D 아이콘) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-orb" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f6ecd9"/><stop offset="1" stop-color="#c3aed6"/></radialGradient>
    <symbol id="s-cube" viewBox="-14 -25 28 28"><polygon points="0,-21 10,-16 0,-11 -10,-16" fill="#fffaf0"/><polygon points="-10,-16 0,-11 0,0 -10,-5" fill="#efe0c6"/><polygon points="0,-11 10,-16 10,-5 0,0" fill="#d5bf9f"/><path d="M-10 -10.5 L0 -5.5 L10 -10.5" fill="none" stroke="#f29a52" stroke-width="2"/></symbol>
    <symbol id="s-holo" viewBox="-15 -25 30 28"><polygon points="0,-21 10,-16 0,-11 -10,-16" fill="#8ff0e0" opacity=".25"/><polygon points="-10,-16 0,-11 0,0 -10,-5" fill="#8ff0e0" opacity=".15"/><polygon points="0,-11 10,-16 10,-5 0,0" fill="#8ff0e0" opacity=".08"/><path d="M0 -21 L10 -16 L10 -5 L0 0 L-10 -5 L-10 -16 Z M-10 -16 L0 -11 L10 -16 M0 -11 V0" fill="none" stroke="#c4fff4" stroke-width="1" stroke-dasharray="2 2"/></symbol>
    <symbol id="s-prism" viewBox="-15 -21 30 30"><polygon points="-12,0 0,6 6,-10 -6,-16" fill="#fff6e6"/><polygon points="0,6 12,0 6,-10" fill="#d5bf9f"/><path d="M-9 -8 L3 -2" stroke="#f29a52" stroke-width="2"/></symbol>
    <symbol id="s-sphere" viewBox="-15 -27 30 30"><circle cx="0" cy="-12" r="9.5" fill="url(#g-orb)"/><polygon points="-6,-18 1,-21 -1,-14" fill="#ffffff" opacity=".75"/><circle cx="0" cy="-21.5" r="2" fill="#ff9d4d"/></symbol>
    <symbol id="s-octa" viewBox="-15 -30 30 31"><polygon points="0,-28 -10,-16 0,-11" fill="#ffffff"/><polygon points="0,-28 0,-11 10,-16" fill="#e6d3b6"/><polygon points="-10,-16 0,-11 0,-4" fill="#d7c2a6"/><polygon points="0,-11 10,-16 0,-4" fill="#b9a2c0"/></symbol>
    <symbol id="s-pad" viewBox="-17 -21 34 28"><polygon points="-2.6,-14.4 15.6,-5.3 2.6,1.2 -15.6,-7.9" fill="#fffaf0"/><polygon points="-15.6,-7.9 2.6,1.2 2.6,3.8 -15.6,-5.3" fill="#efe0c6"/><polygon points="2.6,1.2 15.6,-5.3 15.6,-2.7 2.6,3.8" fill="#d5bf9f"/><path d="M-6.5 -12.4 L6.2 -6 M-9.1 -11.1 L3.6 -4.7 M-11.7 -9.8 L-2 -5" stroke="#9fb0c9" stroke-width="1.3" stroke-linecap="round"/></symbol>
    <symbol id="s-b-talk" viewBox="-8 -8 16 16"><circle r="7.4" fill="#232a5c" stroke="#fffaf0" stroke-width="1.4"/><path d="M-3.5 -3.2 h7 a1.4 1.4 0 0 1 1.4 1.4 v3 a1.4 1.4 0 0 1 -1.4 1.4 h-3.2 l-2.6 2 v-2 h-1.2 a1.4 1.4 0 0 1 -1.4 -1.4 v-3 a1.4 1.4 0 0 1 1.4 -1.4 z" fill="#fffaf0"/></symbol>
    <symbol id="s-b-conflict" viewBox="-8 -8 16 16"><circle r="7.4" fill="#232a5c" stroke="#fffaf0" stroke-width="1.4"/><path d="M1.2 -5 L-3 1 L0 1 L-1.2 5 L3 -1 L0 -1 Z" fill="#ffb36b"/></symbol>
    <symbol id="s-b-clock" viewBox="-8 -8 16 16"><circle r="7.4" fill="#232a5c" stroke="#fffaf0" stroke-width="1.4"/><circle r="4" fill="none" stroke="#fffaf0" stroke-width="1.4"/><path d="M0 -2.4 V0 L1.8 1.2" stroke="#fffaf0" stroke-width="1.4" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="s-b-warn" viewBox="-8 -8 16 16"><circle r="7.4" fill="#f29a52" stroke="#fffaf0" stroke-width="1.4"/><path d="M0 -4.6 L4.4 3.2 L-4.4 3.2 Z" fill="#232a5c"/></symbol>
    <symbol id="s-b-check" viewBox="-8 -8 16 16"><circle r="7.4" fill="#232a5c" stroke="#fffaf0" stroke-width="1.4"/><path d="M-3 0 L-1 2.2 L3.2 -2.2" stroke="#8ff0e0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<main class="app">
  <canvas id="scene" aria-label="팀 레포 정거장 3D 장면: 드래그해서 360도 돌려볼 수 있어요"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="labels" class="labels"></div>
  <div id="top" class="top"></div>
  <div id="side" class="side"></div>
  <div id="map" class="map"></div>
  <div class="hint panel">
    <span>드래그 360° 회전 · 휠 확대 · 아바타·PR #21 클릭</span>
    <button id="reset" type="button" class="btn btn-teal-outline">처음 시점</button>
    <span id="avatar-error" class="warm" hidden></span>
  </div>
  <div id="toast" class="toast panel" role="status" hidden></div>
</main>

<script type="module" src="./js/main.js"></script>
</body>
</html>
