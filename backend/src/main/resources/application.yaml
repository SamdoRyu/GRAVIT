spring:
  application:
    name: backend
  config:
    # Local dev: read the repo-root .env (the same file compose.yaml uses). bootRun/test run from backend/.
    # Optional, so CI / deploy work without it; real environment variables always win over this file.
    import: optional:file:../.env[.properties]
  datasource:
    # Deploy can override these with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gravit}
    username: ${MYSQL_USER:gravit}
    password: ${MYSQL_PASSWORD:}
  # Schema changes go through Flyway: src/main/resources/db/migration/V{n}__{desc}.sql.
  # Hibernate ddl-auto stays at Spring's default for MySQL (none).
  jpa:
    properties:
      # Store Instants as UTC regardless of the server's time zone.
      hibernate.jdbc.time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          # GitHub login (FR-AUTH-01) with the GitHub App's OAuth client. Provider URLs are Spring's built-in "github".
          # Callback: {origin}/login/oauth2/code/github — register it in the GitHub App settings.
          # Unset → "not-configured": the server still starts, but GitHub rejects the login.
          github:
            client-id: ${GITHUB_APP_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_APP_CLIENT_SECRET:not-configured}
  jackson:
    deserialization:
      # CONTRACTS.md 「5」: unknown request fields are rejected as `invalid`, not silently dropped.
      fail-on-unknown-properties: true

server:
  servlet:
    session:
      # CONTRACTS.md 「10」: session expires 60 min after the last request, cookie SameSite=Lax.
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        # HTTPS deploy: SERVER_SERVLET_SESSION_COOKIE_SECURE=true
        secure: false

app:
  # Allowed origin for write requests (NFR-05). The Vite dev server forwards the browser's Origin as-is.
  origin: ${APP_ORIGIN:http://localhost:5173}
  # Approved instructor accounts: comma-separated GitHub user IDs (not login names). Empty = no instructors.
  instructor-github-user-ids: ${INSTRUCTOR_GITHUB_USER_IDS:}
  # Security-review ID/PW login (P15). Off by default; when off the route does not exist (404). Route: POST /api/review-login.
  review-login-enabled: ${REVIEW_LOGIN_ENABLED:false}
  review-login:
    # Review accounts, read only when review login is on: "username:role:seedLogin:bcryptHash" joined by ";".
    # role = participant | repo_admin | instructor. seedLogin = the demo Seed member the account acts as (empty for
    # instructor). bcrypt hash only — never a plain password, and never commit hashes. Invalid value = server won't start.
    accounts: ${REVIEW_ACCOUNTS:}
  # GitHub App name (URL slug) for the "install / request approval" link on the repository screen (P2). Empty = no link.
  github-app-slug: ${GITHUB_APP_SLUG:}
  # Master admin (ROLE-03, FR-AUTH-03): GitHub login name. v1 grants it no screen, API or extra data access. Empty = none.
  master-admin-github-login: ${MASTER_ADMIN_GITHUB_LOGIN:}
  # GitHub App credentials for server-side sync (installation tokens). Unset = real-workspace sync is recorded as unavailable.
  # The private key file lives in secrets/ (git-ignored) — never commit it.
  github-app:
    id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
